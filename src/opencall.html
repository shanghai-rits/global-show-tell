    <script>
        //rem自动计算
        (function (doc, win) {
            var docEl = doc.documentElement,
                resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize',
                recalc = function () {
                    var clientWidth = docEl.clientWidth;
                    if (!clientWidth) return;
                    docEl.style.fontSize = 100 * (clientWidth / 720) + 'px';
                };

            if (!doc.addEventListener) return;
            win.addEventListener(resizeEvt, recalc, false);
            doc.addEventListener('DOMContentLoaded', recalc, false);
        })(document, window);
    </script>
    <script src="/opencall/assets/sketch.js"></script>

                    <div class="paragraph-box">
                        <p>Join us for NYU's first global showcase of
                            student works that bring together Artificial
                            Intelligence

                        <p>This is your chance to share your creativity

                            <b>AI integration, interactivity</b>, and

                    <div class="paragraph-box">

                            tackle all the following aspects. </p>
                        <p><b>I. Global Learning.</b> For your learning, who
                            supported you while you built this project
                            in
                            NYU's
                            global
                            network? This could be a mentor, a seminar, or
                            an office hour. Beyond classrooms, what
                            inspired
                            you

                            story, a conversation, or a collaboration. </p>
                        <p><b>II. AI Integration.</b> Your project should
                            incorporate AI in some meaningful way. </p>
                        <p><b>III. Interactivity.</b> Your project should be
                            interactive. Here are some keywords for
                            your
                            inspiration:
                            generative, autonomous, responsive,
                            participatory, kinetic, spatial, algorithmic,
                            systemic,
                            multisensory, augmented, live processing,
                            networked, procedural, embodied, real-time, and
                            hybrid.
                        </p>
                        <p>The possibilities are endless, so be
                            creative!</p>

                        </p>

                            <br>
                            When your work demonstrates all three core

                            interactivity,

                        <p><b>II. Physical Space</b>

                            <br /> - Lobby of 370 Jay St location at NYU New

                            <br /> - FutureLab Art and Design Innovation
                            Expo at West Bund Art Center, Shanghai (public

                        </p>
