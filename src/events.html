<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles/events.css">
<link rel="stylesheet" href="/styles/highlights.css">
<script src="/scripts/highlights.js"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="/scripts/vendor/p5.js"></script>
    <script src="/scripts/artwork-lifecycle.js"></script>
    <title>Events - Global Show & Tell</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no,viewport-fit=cover">
    <script>
        //rem自动计算
        (function (doc, win) {
            var docEl = doc.documentElement,
                resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize',
                recalc = function () {
                    var clientWidth = docEl.clientWidth;
                    if (!clientWidth) return;
                    docEl.style.fontSize = 100 * (clientWidth / 720) + 'px';
                };

            if (!doc.addEventListener) return;
            win.addEventListener(resizeEvt, recalc, false);
            doc.addEventListener('DOMContentLoaded', recalc, false);
        })(document, window);
    </script>
    <script src="/about/assets/sketch.js"></script>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/assets/SiteFooter-Dh3EQVVv.js"></script>
  <script type="module" crossorigin src="/assets/myPageEntry-BXs4IFzO.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/SiteFooter-CYqourXx.css">
</head>

<body class="static-page">
    <div id="site-header-root"></div>
    <div id="app" tabindex="-1">
        <div class="page-body" id="allText">
            <div class="li-box">
                <div class="zhuti">
                    <div class="shadow-title">
                        <div class="title-text-bg">
                        </div>
                    </div>
                    <div class="center-box">
                        <div class="img-bg" id="imgBg">
                            <div class="art-backdrop"
                                >
                            </div>
                            <div class="art-canvas"
                                >
                                <main>
                                </main>
                            </div>
                        </div>
                    </div>
                    <div class="on-shadow-title-box">
                        <div class="on-shadow-title-bg">
                        </div>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="events-layout">
                    <article v-for="item in circleEvents" :key="item.id" class="event-bubble"
                        :class="{ 'event-bubble--title-top': item.titlePosition === 'top', 'event-bubble--info-right': item.infoPosition === 'right' }"
                        :style="eventStyle(item)" role="link" tabindex="0" @click="openEventDetail(item.id)"
                        @keydown.enter.prevent="openEventDetail(item.id)"
                        @keydown.space.prevent="openEventDetail(item.id)">
                        <div class="event-bubble-circle" :style="bubbleCircleStyle(item)">
                            <img :src="item.image" :alt="item.titleLines.join(' ')" />
                        </div>
                        <div class="event-info" :style="labelStyle(item)">
                            <div class="event-title" :style="titleStyle(item)">
                                <div v-for="(line, lineIndex) in item.titleLines" :key="item.id + '-title-' + lineIndex"
                                    class="event-title-line" :style="titleLineStyle(item, lineIndex)">{{
                                    line }}</div>
                            </div>
                            <div class="event-date">
                                <div v-for="(line, lineIndex) in item.dateLines" :key="item.id + '-date-' + lineIndex">
                                    {{
                                    line }}</div>
                            </div>
                            <div class="event-tags">
                                <div v-for="(tagLine, lineIndex) in tagLines(item)"
                                    :key="item.id + '-tag-line-' + lineIndex" class="event-tag-line">
                                    <span v-for="(tag, tagIndex) in tagLine"
                                        :key="item.id + '-tag-' + lineIndex + '-' + tag.type + '-' + tag.label + '-' + tagIndex"
                                        class="tag-pill" :class="'tag-pill--' + tag.type">{{
                                        tag.label }}</span>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Highlights Section -->
                <div class="highlights-section">
                    <div class="chapter-title">Highlights</div>
                    <site-highlights :count="9"></site-highlights>
                </div>

            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {

                const tagColors = {
                    exhibition: 'var(--color-tag-exhibition)',
                    event: 'var(--color-tag-event)',
                    info: 'var(--color-tag-info)',
                };

                const circleEvents = ref([
                    {
                        id: 'opening-launch',
                        image: '/events/images/04.jpg',
                        titleLines: ['NYU Global Show & Tell', '(Opening)'],
                        dateLines: ['Apr 13, 2025'],
                        tags: [
                            { label: 'Event', type: 'event' },
                            { label: 'Exhibition', type: 'exhibition' },
                        ],
                        campuses: ['SH', 'NY', 'AD'],
                        tagLines: [
                            [
                                { label: 'Event', type: 'event' },
                                { label: 'Exhibition', type: 'exhibition' },
                            ],
                            [
                                { label: 'SH', type: 'campus' },
                                { label: 'NY', type: 'campus' },
                                { label: 'AD', type: 'campus' },
                            ],
                        ],
                        ringOrder: ['exhibition', 'event'],
                        borderTag: 'event',
                        x: 1,
                        y: 2,
                        size: 20,
                        firstLineWidth: 248,
                        labelWidth: 215,
                    },
                    {
                        id: 'shanghai-show',
                        image: '/events/images/IMA Gallery Exhibition03.jpg',
                        titleLines: ['NYU Global Show & Tell', '(Shanghai)'],
                        dateLines: ['October 9 - 26, 2025'],
                        tagLines: [
                            [
                                { label: 'Exhibition', type: 'exhibition' },
                                { label: 'SH', type: 'campus' },
                            ]
                        ],
                        borderTag: 'exhibition',
                        titlePosition: 'top',
                        x: 28,
                        y: 0,
                        size: 20,
                        firstLineWidth: 248,
                        labelWidth: 228,
                        labelOffsetX: 4,
                    },
                    {
                        id: 'new-york-show',
                        image: '/events/images/New York Opening15.jpg',
                        titleLines: ['NYU Global Show & Tell', '(New York)'],
                        dateLines: ['October 10, 2025'],
                        tags: [
                            { label: 'Event', type: 'event' },
                            { label: 'Exhibition', type: 'exhibition' },
                        ],
                        campuses: ['NY'],
                        tagLines: [
                            [
                                { label: 'Event', type: 'event' },
                                { label: 'Exhibition', type: 'exhibition' },
                                { label: 'NY', type: 'campus' },
                            ]
                        ],
                        ringOrder: ['exhibition', 'event'],
                        borderTag: 'event',
                        titlePosition: 'below',
                        x: 55,
                        y: -2,
                        size: 20,
                        firstLineWidth: 252,
                        labelWidth: 230,
                        labelOffsetX: 6,
                    },
                    {
                        id: 'future-lab',
                        image: '/events/images/FutureLab01.jpg',
                        titleLines: ['Future Lab Exhibition'],
                        dateLines: ['October 31 - November 2,', '2025'],
                        tagLines: [
                            [
                                { label: 'Exhibition', type: 'exhibition' },
                                { label: 'SH', type: 'campus' },
                            ]
                        ],
                        campuses: ['SH'],
                        borderTag: 'exhibition',
                        titlePosition: 'top',
                        x: 80,
                        y: 8,
                        size: 20,
                        firstLineWidth: 244,
                        labelWidth: 220,
                        labelOffsetX: 12,
                    },
                    {
                        id: 'live-diffusion',
                        image: '/events/images/08.jpg',
                        titleLines: ['Opening Project:', 'Live-Diffusion'],
                        dateLines: ['April 9 - April 13, 2025'],
                        tags: [
                            { label: 'Exhibition', type: 'exhibition' },
                        ],
                        campuses: ['SH', 'NY', 'AD'],
                        tagLines: [
                            [
                                { label: 'Exhibition', type: 'exhibition' },
                            ],
                            [
                                { label: 'SH', type: 'campus' },
                                { label: 'NY', type: 'campus' },
                                { label: 'AD', type: 'campus' },
                            ],
                        ],
                        borderTag: 'exhibition',
                        infoPosition: 'right',
                        x: 2,
                        y: 52,
                        size: 11,
                        labelWidth: 230,
                    },
                    {
                        id: 'video-loop',
                        image: '/events/images/08.jpg',
                        titleLines: ['Projects (video', 'loop)'],
                        dateLines: [],
                        tags: [
                            { label: 'Works', type: 'info' },
                        ],
                        campuses: ['SH', 'NY', 'AD'],
                        tagLines: [
                            [
                                { label: 'Works', type: 'info' },
                            ],
                            [
                                { label: 'SH', type: 'campus' },
                                { label: 'NY', type: 'campus' },
                                { label: 'AD', type: 'campus' },
                            ],
                        ],
                        borderTag: 'info',
                        infoPosition: 'right',
                        x: 36,
                        y: 52,
                        size: 11,
                        labelWidth: 200,
                    },
                    {
                        id: 'opening-video-october',
                        image: '/events/images/06.jpg',
                        titleLines: ['Opening Video (SH)'],
                        dateLines: ['October 9, 2025'],
                        tags: [
                            { label: 'Event', type: 'event' },
                        ],
                        campuses: ['SH'],
                        tagLines: [
                            [
                                { label: 'Event', type: 'event' },
                                { label: 'SH', type: 'campus' },
                            ],
                        ],
                        borderTag: 'event',
                        infoPosition: 'right',
                        x: 70,
                        y: 52,
                        size: 11,
                        labelWidth: 185,
                    },
                    {
                        id: 'lightning-talks',
                        image: '/events/images/New York Opening02.jpg',
                        titleLines: ['Lightning', 'Talks (NY)'],
                        dateLines: ['October 10, 2025'],
                        tags: [
                            { label: 'Event', type: 'event' },
                        ],
                        campuses: ['NY'],
                        tagLines: [
                            [
                                { label: 'Event', type: 'event' },
                                { label: 'NY', type: 'campus' },
                            ],
                        ],
                        borderTag: 'event',
                        infoPosition: 'right',
                        x: 2,
                        y: 73,
                        size: 11,
                        labelWidth: 180,
                    },
                    {
                        id: 'moon-interview',
                        image: '/events/images/IMA Gallery Exhibition05.jpg',
                        titleLines: ["Moon and Inmi's", 'interview clip'],
                        dateLines: ['October 9, 2025'],
                        tags: [
                            { label: 'Interview', type: 'info' },
                        ],
                        campuses: ['SH'],
                        tagLines: [
                            [
                                { label: 'Interview', type: 'info' },
                                { label: 'SH', type: 'campus' },
                            ],
                        ],
                        borderTag: 'info',
                        infoPosition: 'right',
                        x: 36,
                        y: 73,
                        size: 10.8,
                        labelWidth: 220,
                    },
                    {
                        id: 'opening-video-april',
                        image: '/events/images/06.jpg',
                        titleLines: ['Opening Video (SH)'],
                        dateLines: ['Apr 13, 2025'],
                        tags: [
                            { label: 'Event', type: 'event' },
                        ],
                        campuses: ['SH'],
                        tagLines: [
                            [
                                { label: 'Event', type: 'event' },
                                { label: 'SH', type: 'campus' },
                            ],
                        ],
                        borderTag: 'event',
                        infoPosition: 'right',
                        x: 70,
                        y: 73,
                        size: 10.8,
                        labelWidth: 185,
                    },
                ]);

                function eventStyle(item) {
                    const primaryTagLine = tagLines(item)[0] || [];
                    const primaryTag = primaryTagLine[0];
                    const primaryTagType = primaryTag?.type || item.borderTag || 'event';
                    const primaryTagLabel = (primaryTag?.label || '').toLowerCase();
                    let hoverColor = tagColors[primaryTagType] || tagColors.event;

                    if (primaryTagType === 'exhibition') {
                        hoverColor = 'var(--color-tag-exhibition)';
                    } else if (primaryTagType === 'event') {
                        hoverColor = 'var(--color-tag-event)';
                    } else if (primaryTagLabel === 'works' || primaryTagType === 'info') {
                        hoverColor = 'var(--color-tag-info)';
                    }

                    return {
                        '--x': item.x,
                        '--y': item.y,
                        '--size': item.size,
                        '--hover-title-color': hoverColor,
                        '--hover-glow-color': hoverColor,
                    };
                }

                function bubbleCircleStyle(item) {
                    const ringTypes = [...new Set((item.tags || []).map((tag) => tag.type))];
                    const orderedRingTypes = (item.ringOrder || []).filter((type) => ringTypes.includes(type));
                    const remainingRingTypes = ringTypes.filter((type) => !orderedRingTypes.includes(type));
                    const colorTypes = (orderedRingTypes.length > 0
                        ? [...orderedRingTypes, ...remainingRingTypes]
                        : ringTypes).length > 0
                        ? [...orderedRingTypes, ...remainingRingTypes].filter((type, index, array) => array.indexOf(type) === index)
                        : [item.borderTag || 'event'];
                    const ringShadow = colorTypes
                        .map((type, index) => `0 0 0 ${(index + 1) * 3}px ${tagColors[type] || tagColors.event}`)
                        .join(', ');

                    return {
                        '--ring-shadow': ringShadow,
                    };
                }

                function combinedTags(item) {
                    const contentTags = item.tags || [];
                    const campusTags = (item.campuses || []).map((campus) => ({
                        label: campus,
                        type: 'campus',
                    }));

                    return [...contentTags, ...campusTags];
                }

                function tagLines(item) {
                    if (item.tagLines && item.tagLines.length > 0) {
                        return item.tagLines.filter((line) => (line || []).length > 0);
                    }

                    const contentTags = item.tags || [];
                    const campusTags = (item.campuses || []).map((campus) => ({
                        label: campus,
                        type: 'campus',
                    }));

                    return [contentTags, campusTags].filter((line) => line.length > 0);
                }

                function labelStyle(item) {
                    return {
                        marginLeft: `${item.labelOffsetX || 0}px`,
                        width: `${item.labelWidth || 200}px`,
                    };
                }

                function titleStyle(item) {
                    return {
                        fontSize: item.titleSize
                            ? typeof item.titleSize === 'number'
                                ? `${item.titleSize}px`
                                : item.titleSize
                            : undefined,
                    };
                }

                function titleLineStyle(item, lineIndex) {
                    if (lineIndex !== 0 || !item.firstLineWidth) {
                        return undefined;
                    }

                    return {
                        width: `${item.firstLineWidth}px`,
                    };
                }

                function openEventDetail(id) {
                    window.location.href = `/event/${id}`;
                }

                return {
                    circleEvents,
                    eventStyle,
                    bubbleCircleStyle,
                    combinedTags,
                    tagLines,
                    labelStyle,
                    titleStyle,
                    titleLineStyle,
                    openEventDetail,
                }
            }
        }).component('site-highlights', window.NYUHighlights).mount('#app')
    </script>
</body>

</html>
