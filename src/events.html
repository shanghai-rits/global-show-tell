    <title>Events - Global Show & Tell</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no,viewport-fit=cover">
    <script>
        //rem自动计算
        (function (doc, win) {
            var docEl = doc.documentElement,
                resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize',
                recalc = function () {
                    var clientWidth = docEl.clientWidth;
                    if (!clientWidth) return;
                    docEl.style.fontSize = 100 * (clientWidth / 720) + 'px';
                };

            if (!doc.addEventListener) return;
            win.addEventListener(resizeEvt, recalc, false);
            doc.addEventListener('DOMContentLoaded', recalc, false);
        })(document, window);
    </script>
    <script src="/about/assets/sketch.js"></script>
</head>

                    <div class="center-box">

                                style="position: absolute;left: 0;right: 0;top:0;bottom:0;z-index: -2;background:#eaea24">

                                </main>
                            </div>
                        </div>
                    </div>
                    <div class="on-shadow-title-box">
                        <div class="on-shadow-title-bg">
                        </div>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="events-layout">
                    <article v-for="item in circleEvents" :key="item.id" class="event-bubble"
                        :class="{ 'event-bubble--title-top': item.titlePosition === 'top', 'event-bubble--info-right': item.infoPosition === 'right' }"
                        :style="eventStyle(item)" role="link" tabindex="0" @click="openEventDetail(item.id)"
                        @keydown.enter.prevent="openEventDetail(item.id)"
                        @keydown.space.prevent="openEventDetail(item.id)">
                        <div class="event-bubble-circle" :style="bubbleCircleStyle(item)">
                            <img :src="item.image" :alt="item.titleLines.join(' ')" />
                        </div>
                        <div class="event-info" :style="labelStyle(item)">
                            <div class="event-title" :style="titleStyle(item)">
                                <div v-for="(line, lineIndex) in item.titleLines" :key="item.id + '-title-' + lineIndex"
                                    class="event-title-line" :style="titleLineStyle(item, lineIndex)">{{
                                    line }}</div>
                            </div>
                            <div class="event-date">
                                <div v-for="(line, lineIndex) in item.dateLines" :key="item.id + '-date-' + lineIndex">
                                    {{
                                    line }}</div>
                            </div>
                            <div class="event-tags">
                                <div v-for="(tagLine, lineIndex) in tagLines(item)"
                                    :key="item.id + '-tag-line-' + lineIndex" class="event-tag-line">
                                    <span v-for="(tag, tagIndex) in tagLine"
                                        :key="item.id + '-tag-' + lineIndex + '-' + tag.type + '-' + tag.label + '-' + tagIndex"
                                        class="tag-pill" :class="'tag-pill--' + tag.type">{{
                                        tag.label }}</span>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Highlights Section -->
                <div class="highlights-section">
                    <div class="chapter-title">Highlights</div>
                    <div class="photo-box">
                        <div v-for="(img, index) in displayedImages" :key="'photo-' + index" class="photo-item">
                            <div class="img-layer img-back">
                                <img :src="nextImages[index] ? nextImages[index].src : img.src" />
                            </div>
                            <div class="img-layer img-front" :class="{ 'cross-fade': crossFading }">
                                <img :src="img.src" />
                            </div>
                            <div class="photo-title" @click="openPreview(img.src)">
                                <div class="main-title">{{ img.title
                                    }}</div>
                                <div class="sub-title" v-if="img.subtitle">
                                    {{ img.subtitle }}
                                    <div class="location" v-if="img.location">{{ img.location
                                        }}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Preview overlay -->
                <div class="preview-overlay" v-if="previewSrc" @click="previewSrc = null">
                    <img :src="previewSrc" />
                </div>

            </div>
        </div>
    </div>

                        tagLines: [

                    {

                        ],

                const displayedImages = ref([]);
                const nextImages = ref([]);
                const crossFading = ref(false);
                const previewSrc = ref(null);
                let timer = null;

                function eventStyle(item) {
                    const primaryTagLine = tagLines(item)[0] || [];
                    const primaryTag = primaryTagLine[0];
                    const primaryTagType = primaryTag?.type || item.borderTag || 'event';
                    const primaryTagLabel = (primaryTag?.label || '').toLowerCase();
                    let hoverColor = tagColors[primaryTagType] || tagColors.event;

                    if (primaryTagType === 'exhibition') {
                        hoverColor = 'rgba(255, 182, 236, 1)';
                    } else if (primaryTagType === 'event') {
                        hoverColor = 'rgba(222, 247, 94, 1)';
                    } else if (primaryTagLabel === 'works' || primaryTagType === 'info') {
                        hoverColor = 'rgba(140, 245, 255, 1)';
                    }

                    return {
                        '--x': item.x,
                        '--y': item.y,
                        '--size': item.size,
                        '--hover-title-color': hoverColor,
                        '--hover-glow-color': hoverColor,
                    };
                }

                function bubbleCircleStyle(item) {
                    const ringTypes = [...new Set((item.tags || []).map((tag) => tag.type))];
                    const orderedRingTypes = (item.ringOrder || []).filter((type) => ringTypes.includes(type));
                    const remainingRingTypes = ringTypes.filter((type) => !orderedRingTypes.includes(type));
                    const colorTypes = (orderedRingTypes.length > 0
                        ? [...orderedRingTypes, ...remainingRingTypes]
                        : ringTypes).length > 0
                        ? [...orderedRingTypes, ...remainingRingTypes].filter((type, index, array) => array.indexOf(type) === index)
                        : [item.borderTag || 'event'];
                    const ringShadow = colorTypes
                        .map((type, index) => `0 0 0 ${(index + 1) * 3}px ${tagColors[type] || tagColors.event}`)
                        .join(', ');

                    return {
                        '--ring-shadow': ringShadow,
                    };
                }

                function combinedTags(item) {
                    const contentTags = item.tags || [];
                    const campusTags = (item.campuses || []).map((campus) => ({
                        label: campus,
                        type: 'campus',
                    }));

                    return [...contentTags, ...campusTags];
                }

                function tagLines(item) {
                    if (item.tagLines && item.tagLines.length > 0) {
                        return item.tagLines.filter((line) => (line || []).length > 0);
                    }

                    const contentTags = item.tags || [];
                    const campusTags = (item.campuses || []).map((campus) => ({
                        label: campus,
                        type: 'campus',
                    }));

                    return [contentTags, campusTags].filter((line) => line.length > 0);
                }

                function labelStyle(item) {
                    return {
                        marginLeft: `${item.labelOffsetX || 0}px`,
                        width: `${item.labelWidth || 200}px`,
                    };
                }

                function titleStyle(item) {
                    return {
                        fontSize: item.titleSize
                            ? typeof item.titleSize === 'number'
                                ? `${item.titleSize}px`
                                : item.titleSize
                            : undefined,
                    };
                }

                function titleLineStyle(item, lineIndex) {
                    if (lineIndex !== 0 || !item.firstLineWidth) {
                        return undefined;
                    }

                    return {
                        width: `${item.firstLineWidth}px`,
                    };
                }

                function shuffle(arr) {
                    const a = [...arr];
                    for (let i = a.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [a[i], a[j]] = [a[j], a[i]];
                    }
                    return a;
                }

                function pickRandom9() {
                    return shuffle(allImages.value).slice(0, 9);
                }

                function openPreview(src) {
                    previewSrc.value = src;
                }

                function openEventDetail(id) {
                    window.location.href = `/event/${id}`;
                }

                function rotateImages() {
                    // Set next images on the back layer
                    const next = pickRandom9();
                    nextImages.value = next;
                    // Trigger crossfade: front fades out to reveal back
                    crossFading.value = true;
                    setTimeout(() => {
                        // Swap: move next to front, reset
                        displayedImages.value = next;
                        crossFading.value = false;
                        nextImages.value = [];
                    }, 800); // match CSS transition duration
                }

                onMounted(() => {
                    displayedImages.value = pickRandom9();
                    timer = setInterval(rotateImages, 9000);
                });

                onUnmounted(() => {
                    if (timer) clearInterval(timer);
                });

                return {
                    circleEvents,
                    displayedImages,
                    nextImages,
                    crossFading,
                    previewSrc,
                    eventStyle,
                    bubbleCircleStyle,
                    combinedTags,
                    tagLines,
                    labelStyle,
                    titleStyle,
                    titleLineStyle,
                    openPreview,
                    openEventDetail,
                }
            }
        }).mount('#app')
    </script>
